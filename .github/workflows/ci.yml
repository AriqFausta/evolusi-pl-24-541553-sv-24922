name: Laravel CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test


  staging:
    name: Staging
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Staging
        run: echo "Deploying application to staging environment..."


  production:
    name: Production
    runs-on: ubuntu-latest
    needs: staging

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:
      - name: Production deployment
        run: echo "Starting production deployment..."

      - name: Step 1
        run: echo "1. Pull source code terbaru"

      - name: Step 2
        run: echo "2. Install/update dependency dengan composer install"

      - name: Step 3
        run: echo "3. Jalankan migration database"

      - name: Step 4
        run: echo "4. Build frontend assets"

      - name: Step 5
        run: echo "5. Clear dan cache konfigurasi Laravel"

      - name: Step 6
        run: echo "6. Restart service/application"

      - name: Step 7
        run: echo "7. Verifikasi deployment"
